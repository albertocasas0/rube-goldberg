<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Máquina Rube Goldberg — Editor</title>
<style>
/* =========================================================================
   DESIGN TOKENS — sección 2 del documento fuente.
   Todo valor visual del juego debe referenciarse por variable, nunca
   hardcodeado, para poder reemplazar por marca oficial del cliente
   editando solo este archivo (equivalente al theme.json de la sección 22).
   ========================================================================= */

:root {
  /* --- 2.1 Paleta de color --- */
  --color-primary: #1565C0;
  --color-primary-dark: #0D47A1;
  --color-primary-light: #64B5F6;
  --color-blueprint-background: #0B3D91;
  --color-blueprint-grid-minor: #2F6FCB;
  --color-blueprint-grid-major: #5B9BE0;
  --color-accent: #FF6F00;
  --color-success: #2E7D32;
  --color-warning: #F9A825;
  --color-danger: #C62828;
  --color-neutral-white: #FFFFFF;
  --color-neutral-dark: #1B1F27;
  --color-ui-panel: #F4F7FB;
  --color-ui-panel-border: #D6E0EC;

  /* --- 6.1 Colores de acento por categoría de pieza --- */
  --color-cat-estructuras: #8D6E63;
  --color-cat-movilidad: #42A5F5;
  --color-cat-impulso: #FF7043;
  --color-cat-interaccion: #AB47BC;
  --color-cat-destruccion: #EF5350;
  --color-cat-especiales: #26A69A;

  /* --- 2.2 Tipografía ---
     Nota: se usan pilas de fuentes del sistema como fallback porque este
     proyecto está pensado para poder abrirse sin conexión (offline-first,
     ver sección 21). Si hay conexión, se puede sumar @import de Fredoka/
     Nunito/JetBrains Mono sin tocar el resto del CSS: solo estas 3 líneas. */
  --font-display: "Baloo 2", "Segoe UI Rounded", "Comic Sans MS", sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --font-blueprint: "JetBrains Mono", "Consolas", "Courier New", monospace;

  /* --- 2.4 Radios, sombras, espaciado --- */
  --radius-sm: 4px;
  --radius-md: 10px;
  --radius-lg: 18px;
  --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.15);
  --spacing-unit: 8px;

  /* --- Layout (sección 4.4), no son "tokens de marca" pero se centralizan
     acá para que todo el CSS los use en vez de números sueltos --- */
  --topbar-height: 56px;
  --rightpanel-width: 280px;
  --bottombar-height: 96px;
  --inventory-width: 240px;

  /* --- Unidad de Grilla (UG), sección 0 y 3: 1 UG = 64px a 1920x1080 --- */
  --ug-px: 64px;
}

/* =========================================================================
   LAYOUT — Editor de Construcción, sección 4.4 del documento.
   4 regiones fijas (Barra Superior, Área Central, Panel Derecho,
   Barra Inferior) + Panel de Inventario deslizable + overlay global.
   ========================================================================= */

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  height: 100%;
  font-family: var(--font-body);
  color: var(--color-neutral-dark);
  overflow: hidden;
  background: var(--color-neutral-dark);
}

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  width: 100vw;
}

/* ---------- 4.4.1 Barra Superior ---------- */
#topbar {
  height: var(--topbar-height);
  background: var(--color-ui-panel);
  border-bottom: 1px solid var(--color-ui-panel-border);
  display: flex;
  align-items: center;
  padding: 0 var(--spacing-unit);
  gap: 4px;
  flex-shrink: 0;
  z-index: 30;
}

.topbar-btn {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  transition: background 0.15s ease;
}

.topbar-btn:hover {
  background: var(--color-ui-panel-border);
}

.topbar-btn.primary {
  background: var(--color-accent);
  color: white;
}

.topbar-btn.primary:hover {
  filter: brightness(1.08);
}

.topbar-btn[disabled] {
  opacity: 0.35;
  cursor: not-allowed;
}

.topbar-btn[disabled]:hover {
  background: transparent;
}

.topbar-sep {
  width: 1px;
  align-self: stretch;
  margin: 8px 4px;
  background: var(--color-ui-panel-border);
}

.topbar-spacer {
  flex: 1;
}

#design-name {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 700;
  border: 1px solid transparent;
  background: transparent;
  border-radius: var(--radius-sm);
  padding: 6px 10px;
  min-width: 140px;
  max-width: 260px;
}

#design-name:hover,
#design-name:focus {
  border-color: var(--color-ui-panel-border);
  background: white;
  outline: none;
}

/* tooltip simple */
.tooltip {
  position: absolute;
  top: 46px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--color-neutral-dark);
  color: white;
  font-size: 11px;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.1s ease;
  z-index: 50;
}

.topbar-btn:hover .tooltip {
  opacity: 1;
}

/* ---------- fila central: inventario + canvas + panel derecho ---------- */
#main-row {
  flex: 1;
  display: flex;
  min-height: 0;
  position: relative;
}

/* ---------- 4.4.5 Panel de Inventario (cajón deslizable) ---------- */
#inventory-drawer {
  width: var(--inventory-width);
  flex-shrink: 0;
  background: var(--color-ui-panel);
  border-right: 1px solid var(--color-ui-panel-border);
  overflow-y: auto;
  margin-left: calc(-1 * var(--inventory-width));
  transition: margin-left 0.2s ease;
  z-index: 20;
}

#inventory-drawer.open {
  margin-left: 0;
}

#inventory-drawer h3 {
  font-family: var(--font-display);
  font-size: 14px;
  margin: var(--spacing-unit);
}

#inventory-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

#inventory-table th {
  text-align: left;
  padding: 6px 8px;
  color: #6b7280;
  font-weight: 600;
  border-bottom: 1px solid var(--color-ui-panel-border);
}

#inventory-table td {
  padding: 6px 8px;
  border-bottom: 1px solid var(--color-ui-panel-border);
}

#inventory-table tr.depleted {
  background: rgba(249, 168, 37, 0.1); /* color.warning 10% */
}

/* ---------- 4.4.2 Área Central (canvas / plano) ---------- */
#canvas-area {
  flex: 1;
  position: relative;
  overflow: hidden;
  background: var(--color-blueprint-background);
}

#game-canvas {
  display: block;
  width: 100%;
  height: 100%;
  cursor: default;
}

#zoom-indicator {
  position: absolute;
  bottom: 10px;
  left: 10px;
  font-family: var(--font-blueprint);
  font-size: 11px;
  color: rgba(255, 255, 255, 0.75);
  background: rgba(0, 0, 0, 0.25);
  padding: 3px 8px;
  border-radius: var(--radius-sm);
  pointer-events: none;
}

#state-banner {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 700;
  padding: 8px 20px;
  border-radius: var(--radius-lg);
  background: rgba(11, 15, 25, 0.7);
  color: white;
  pointer-events: none;
  transition: opacity 0.2s ease;
}

#state-banner.hidden {
  opacity: 0;
}

#state-banner.success { color: #A5D6A7; }
#state-banner.failure { color: #EF9A9A; }

/* ---------- 4.4.3 Panel Derecho ---------- */
#right-panel {
  width: var(--rightpanel-width);
  flex-shrink: 0;
  background: var(--color-ui-panel);
  border-left: 1px solid var(--color-ui-panel-border);
  display: flex;
  flex-direction: column;
  z-index: 20;
}

#right-panel.hidden {
  display: none;
}

#piece-search {
  margin: var(--spacing-unit);
  padding: 8px 10px;
  border: 1px solid var(--color-ui-panel-border);
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-family: var(--font-body);
}

#category-tabs {
  display: flex;
  gap: 4px;
  padding: 0 var(--spacing-unit) var(--spacing-unit);
  overflow-x: auto;
}

.category-tab {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-sm);
  border: 2px solid transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 15px;
  flex-shrink: 0;
  background: var(--color-neutral-white);
}

.category-tab.active {
  border-color: var(--color-neutral-dark);
}

#piece-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: var(--spacing-unit);
  overflow-y: auto;
  flex: 1;
  align-content: start;
}

.piece-cell {
  width: 76px;
  height: 76px;
  border-radius: var(--radius-md);
  background: var(--color-neutral-white);
  border: 2px solid var(--color-ui-panel-border);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  cursor: grab;
  position: relative;
  font-size: 10px;
  text-align: center;
  padding: 4px;
  user-select: none;
}

.piece-cell:hover {
  border-color: var(--color-accent);
}

.piece-cell.selected {
  border-color: var(--color-accent);
  background: #FFF3E0;
}

.piece-cell .piece-icon {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 14px;
}

.piece-cell .piece-count {
  position: absolute;
  bottom: 3px;
  right: 5px;
  font-size: 9px;
  font-weight: 700;
  color: #6b7280;
}

.piece-cell.locked {
  opacity: 0.45;
  cursor: not-allowed;
  filter: grayscale(1);
}

/* Inspector de pieza (reemplaza la grilla cuando hay una pieza seleccionada) */
#inspector-panel {
  padding: var(--spacing-unit);
  overflow-y: auto;
  flex: 1;
  display: none;
}

#inspector-panel.active {
  display: block;
}

#inspector-panel h4 {
  font-family: var(--font-display);
  margin: 0 0 4px;
  font-size: 15px;
}

#inspector-panel .field {
  margin-bottom: 12px;
}

#inspector-panel label {
  font-size: 12px;
  color: #4b5563;
  display: block;
  margin-bottom: 4px;
}

#inspector-panel select,
#inspector-panel input[type="range"] {
  width: 100%;
}

#inspector-panel .value-readout {
  font-family: var(--font-blueprint);
  font-size: 11px;
  color: #6b7280;
}

/* ---------- 4.4.4 Barra Inferior — Fondos ---------- */
#bottombar {
  height: var(--bottombar-height);
  background: var(--color-ui-panel);
  border-top: 1px solid var(--color-ui-panel-border);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 var(--spacing-unit);
  overflow-x: auto;
  flex-shrink: 0;
  z-index: 20;
}

#bottombar.hidden {
  display: none;
}

.bg-thumb {
  width: 120px;
  height: 72px;
  border-radius: var(--radius-sm);
  flex-shrink: 0;
  border: 2px solid transparent;
  cursor: pointer;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  color: white;
  font-size: 11px;
  font-weight: 700;
  padding-bottom: 4px;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
  background-size: cover;
  background-position: center;
}

.bg-thumb.active {
  border-color: var(--color-accent);
}

.bg-thumb.locked {
  filter: grayscale(1) brightness(0.6);
  cursor: not-allowed;
}

/* ---------- overlay global (HUD persistente) ---------- */
#overlay-global {
  position: absolute;
  top: var(--topbar-height);
  right: calc(var(--rightpanel-width) + 12px);
  z-index: 40;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
  pointer-events: none;
}

#tornillin-bubble {
  max-width: 260px;
  background: white;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  padding: 10px 14px;
  font-size: 13px;
  margin-top: 10px;
  display: flex;
  gap: 8px;
  align-items: flex-start;
  opacity: 0;
  transform: translateY(-6px);
  transition: opacity 0.2s ease, transform 0.2s ease;
}

#tornillin-bubble.visible {
  opacity: 1;
  transform: translateY(0);
}

#tornillin-bubble .avatar {
  font-size: 22px;
  flex-shrink: 0;
}

/* ---------- modal genérico (Resultados, confirmaciones) ---------- */
#modal-root {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(11, 15, 25, 0.55);
  z-index: 100;
}

#modal-root.visible {
  display: flex;
}

.modal-card {
  background: white;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  padding: 24px;
  min-width: 320px;
  max-width: 440px;
  font-family: var(--font-body);
}

.modal-card h2 {
  font-family: var(--font-display);
  margin: 0 0 8px;
  font-size: 20px;
}

.modal-card .modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 18px;
}

.modal-card ul.error-list {
  margin: 8px 0;
  padding-left: 18px;
  font-size: 13px;
  color: var(--color-danger);
}

button.btn {
  border: none;
  border-radius: var(--radius-sm);
  padding: 9px 16px;
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
}

button.btn-primary {
  background: var(--color-accent);
  color: white;
}

button.btn-secondary {
  background: var(--color-ui-panel-border);
  color: var(--color-neutral-dark);
}

button.btn:hover {
  filter: brightness(1.06);
}

/* ===================== Niveles / Modo Reconstruir ===================== */
#challenge-hud {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  display: none; align-items: center; gap: 12px; z-index: 6;
  background: rgba(27,31,39,0.88); color: #fff; padding: 8px 14px;
  border-radius: 12px; border: 1px solid rgba(255,255,255,0.18);
  font-size: 14px; box-shadow: 0 4px 14px rgba(0,0,0,0.35);
}
#challenge-hud.visible { display: flex; }
#challenge-hud .ch-title { font-weight: 700; }
#challenge-hud .ch-phase { opacity: 0.85; }
#challenge-hud .ch-count {
  font-variant-numeric: tabular-nums; font-weight: 800; font-size: 20px;
  min-width: 34px; text-align: center; color: #FFB74D;
}
#challenge-hud button {
  font: inherit; cursor: pointer; border: 0; border-radius: 8px;
  padding: 6px 10px; background: #fff; color: #1B1F27; font-weight: 600;
}
#challenge-hud button[disabled] { opacity: 0.45; cursor: not-allowed; }
#challenge-hud button.danger { background: #FFCDD2; }
#challenge-fade {
  position: absolute; inset: 0; background: #0B3D91; opacity: 0;
  pointer-events: none; z-index: 5; transition: opacity 0.6s ease;
}
#challenge-fade.on { opacity: 1; }
.level-row {
  width: 100%; margin-bottom: 8px; padding: 12px; display: flex;
  justify-content: space-between; align-items: center; gap: 12px;
  border: 1px solid var(--color-ui-panel-border); border-radius: var(--radius-md);
}
.level-row .lv-title { font-weight: 700; }
.level-row .lv-meta { font-size: 12px; color: #667; margin-top: 2px; }
.level-row .lv-stars { color: #F9A825; letter-spacing: 2px; font-size: 16px; }
.level-row .lv-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.result-stars { font-size: 38px; color: #F9A825; letter-spacing: 6px; text-align: center; margin: 4px 0 8px; }
.result-stars .off { color: #CFD8DC; }
.result-list { font-size: 13px; line-height: 1.7; margin: 0 0 8px 0; padding-left: 18px; }

/* ---------- Menú hamburguesa ---------- */
#btn-menu { font-size: 22px; }
#design-name { max-width: 220px; min-width: 0; }
#menu-backdrop {
  position: fixed; inset: 0; background: rgba(11,15,25,0.5); z-index: 88;
  opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
}
#menu-backdrop.open { opacity: 1; pointer-events: auto; }
#side-menu {
  position: fixed; top: 0; left: 0; bottom: 0; width: 280px; max-width: 85vw;
  background: var(--color-ui-panel); border-right: 1px solid var(--color-ui-panel-border);
  box-shadow: 6px 0 24px rgba(0,0,0,0.35); z-index: 90; overflow-y: auto;
  padding: 8px 8px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 2px;
  transform: translateX(-105%); transition: transform 0.22s ease; visibility: hidden;
}
#side-menu.open { transform: none; visibility: visible; }
.menu-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 10px; }
.menu-title { font-family: var(--font-display); font-weight: 700; font-size: 15px; }
#btn-menu-close { border: 0; background: transparent; font-size: 20px; width: 40px; height: 40px; border-radius: 8px; cursor: pointer; color: inherit; }
.menu-item {
  display: flex; align-items: center; gap: 14px; width: 100%; min-height: 48px; padding: 0 12px;
  border: 0; border-radius: 10px; background: transparent; color: inherit; font: inherit; font-size: 20px;
  text-align: left; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.menu-item:hover, .menu-item:focus-visible { background: rgba(120,140,180,0.18); outline: none; }
.menu-label { font-size: 15px; }
.menu-sep { height: 1px; background: var(--color-ui-panel-border); margin: 6px 4px; }

/* ---------- Tutorial ---------- */
.tutorial-card { max-width: 520px; width: calc(100vw - 24px); max-height: 92%; overflow-y: auto; }
.tut-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.tut-head h2 { margin: 0; }
.tut-big { font-size: 34px; line-height: 1; }
.tut-body { font-size: 14.5px; line-height: 1.5; }
.tut-body p { margin: 8px 0; }
.tut-row { display: flex; gap: 12px; align-items: flex-start; margin: 10px 0; }
.tut-ic { flex: 0 0 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff; }
.tut-list { margin: 8px 0; padding-left: 20px; }
.tut-list li { margin: 6px 0; }
.tut-hint { background: rgba(66,165,245,0.14); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.tut-dots { display: flex; gap: 6px; justify-content: center; margin: 14px 0 0; }
.tut-dots span { width: 9px; height: 9px; border-radius: 50%; background: #c5ccd8; cursor: pointer; }
.tut-dots span.on { background: var(--color-accent); transform: scale(1.25); }
.tut-actions { align-items: center; }
.tut-spacer { flex: 1; }

/* ---------- Celular / táctil ---------- */
#touch-bar {
  display: none;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: 10px;
  gap: 6px;
  z-index: 30;
  padding: 6px;
  background: rgba(27,31,39,0.85);
  border-radius: 14px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  transition: bottom 0.2s ease;
}
#touch-bar.hidden { display: none !important; }
#touch-bar button {
  font: inherit; font-size: 20px; min-width: 44px; height: 46px; padding: 0 8px;
  border: 0; border-radius: 10px; background: #fff; color: #1B1F27; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
#touch-bar button#touch-sheet { font-size: 15px; font-weight: 700; background: var(--color-accent); color: #fff; white-space: nowrap; }
#touch-bar button#touch-play { background: #2E9E5B; color: #fff; }
#touch-bar button[disabled] { opacity: 0.35; }
#game-canvas { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

@media (max-width: 820px), (pointer: coarse) {
  html, body { overscroll-behavior: none; }
  #app { height: 100%; width: 100%; }
  #touch-bar { display: flex; }
  .topbar-btn { width: 44px; height: 44px; flex-shrink: 0; }
  .topbar-sep { flex-shrink: 0; }
  .topbar-spacer { flex: 0 0 2px; }
  #design-name { flex: 1 1 60px; width: auto; }
  .topbar-spacer { display: none; }
  .tooltip { display: none !important; }
  #bottombar { display: none; }
  #right-panel {
    position: absolute; left: 0; right: 0; bottom: 0; width: auto; height: 48%;
    border-left: 0; border-top: 1px solid var(--color-ui-panel-border);
    box-shadow: 0 -6px 18px rgba(0,0,0,0.3);
    transform: translateY(105%); transition: transform 0.2s ease; z-index: 25;
  }
  #right-panel.sheet-open { transform: none; }
  #touch-bar.up { bottom: calc(48% + 10px); }
  #piece-grid { grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); }
  .piece-cell { width: auto; }
  #zoom-indicator { display: none; }
  #overlay-global { left: 8px; right: 8px; top: 52px; align-items: center; }
  #tornillin-bubble { max-width: min(340px, 100%); width: max-content; }
  #challenge-hud { flex-wrap: wrap; justify-content: center; max-width: calc(100% - 16px); top: 6px; gap: 6px; font-size: 12px; padding: 6px 8px; }
  .modal-card { min-width: 0; width: calc(100vw - 24px); max-height: 92%; overflow-y: auto; padding: 16px; }
}
@media (max-width: 820px) and (orientation: landscape), (max-height: 480px) {
  #right-panel { height: 70%; }
  #touch-bar.up { bottom: calc(70% + 10px); }
}
</style>
</head>
<body>

<div id="app">

  <!-- ===================== 4.4.1 Barra Superior ===================== -->
  <header id="topbar">
    <button class="topbar-btn" id="btn-menu" title="Menú" aria-label="Abrir menú">☰</button>
    <input type="text" id="design-name" value="Mi máquina" />
    <div class="topbar-spacer"></div>

    <button class="topbar-btn primary" id="btn-test" title="Probar diseño">▶️<span class="tooltip">Probar diseño</span></button>
    <button class="topbar-btn" id="btn-pause" style="display:none" title="Pausar / reanudar">⏯️<span class="tooltip">Pausar</span></button>
    <button class="topbar-btn" id="btn-step" style="display:none" title="Avanzar un paso">⏭️<span class="tooltip">Paso a paso</span></button>
    <button class="topbar-btn" id="btn-slowmo" style="display:none" title="Cámara lenta">🐢<span class="tooltip">Cámara lenta</span></button>
    <button class="topbar-btn" id="btn-stop" style="display:none" title="Volver a editar">⏹️<span class="tooltip">Detener</span></button>
  </header>

  <!-- ===================== Menú hamburguesa (izquierda) ===================== -->
  <div id="menu-backdrop"></div>
  <nav id="side-menu" aria-label="Menú principal">
    <div class="menu-head">
      <span class="menu-title">⚙️ Máquina Rube Goldberg</span>
      <button id="btn-menu-close" aria-label="Cerrar menú">✕</button>
    </div>
    <button class="menu-item" id="btn-tutorial" title="Cómo se juega">📖<span class="menu-label">Tutorial</span></button>
    <button class="menu-item" id="btn-levels" title="Niveles armados y modo Reconstruir">🏁<span class="menu-label">Niveles</span></button>
    <div class="menu-sep"></div>
    <button class="menu-item" id="btn-new" title="Nuevo diseño">📄<span class="menu-label">Nuevo diseño</span></button>
    <button class="menu-item" id="btn-open" title="Abrir diseño guardado">📂<span class="menu-label">Abrir</span></button>
    <button class="menu-item" id="btn-save" title="Guardar (Ctrl+S)">💾<span class="menu-label">Guardar</span></button>
    <button class="menu-item" id="btn-clear" title="Borrar todas las piezas">🧹<span class="menu-label">Borrar todo</span></button>
    <div class="menu-sep"></div>
    <button class="menu-item" id="btn-export" title="Exportar diseño a archivo .json">⬇️<span class="menu-label">Exportar a archivo</span></button>
    <button class="menu-item" id="btn-import" title="Importar diseño desde archivo .json">⬆️<span class="menu-label">Importar de archivo</span></button>
    <input type="file" id="btn-import-file" accept=".json" style="display:none" />
    <div class="menu-sep"></div>
    <button class="menu-item" id="btn-inventory" title="Ver inventario de piezas">🎒<span class="menu-label">Inventario</span></button>
  </nav>

  <div id="main-row">

    <!-- ===================== 4.4.5 Panel de Inventario ===================== -->
    <aside id="inventory-drawer">
      <h3>Inventario (modo libre — ilimitado)</h3>
      <table id="inventory-table">
        <thead><tr><th>Pieza</th><th>Cant.</th></tr></thead>
        <tbody></tbody>
      </table>
    </aside>

    <!-- ===================== 4.4.2 Área Central ===================== -->
    <main id="canvas-area">
      <canvas id="game-canvas"></canvas>
      <div id="zoom-indicator">Zoom 100%</div>
      <div id="state-banner" class="hidden"></div>
      
      <div id="challenge-hud">
        <span class="ch-title"></span>
        <span class="ch-phase"></span>
        <span class="ch-count"></span>
        <button id="ch-skip" style="display:none">Saltar</button>
        <button id="ch-compare" style="display:none">Comparar</button>
        <button id="ch-exit" class="danger">Salir</button>
      </div>

      <div id="overlay-global">
        <div id="tornillin-bubble">
          <span class="avatar">🔧</span>
          <span class="text"></span>
        </div>
      </div>
    </main>

    <!-- ===================== 4.4.3 Panel Derecho ===================== -->
    <aside id="right-panel">
      <input type="text" id="piece-search" placeholder="Buscar pieza..." />
      <div id="category-tabs"></div>
      <div id="piece-grid"></div>
      <div id="inspector-panel"></div>
    </aside>

    <!-- Barra táctil (solo celular / pantallas chicas) -->
    <div id="touch-bar">
      <button id="touch-play" type="button" aria-label="Probar (play)">▶️</button>
      <button id="touch-sheet" type="button">🧩 Piezas</button>
      <button id="touch-rot-ccw" type="button" aria-label="Rotar a la izquierda">⟲</button>
      <button id="touch-rot-cw" type="button" aria-label="Rotar a la derecha">⟳</button>
      <button id="touch-delete" type="button" aria-label="Borrar pieza">🗑️</button>
      <button id="touch-cancel" type="button" aria-label="Cancelar">✕</button>
    </div>

  </div>

  <!-- ===================== 4.4.4 Barra Inferior — Fondos ===================== -->
  <footer id="bottombar">
    <div class="bg-thumb active" style="background-color:#37474F;" data-bg="laboratorio">Laboratorio</div>
    <div class="bg-thumb locked" style="background-color:#5D4037;" data-bg="taller" title="Próximamente">Taller</div>
    <div class="bg-thumb locked" style="background-color:#455A64;" data-bg="fabrica" title="Próximamente">Fábrica</div>
  </footer>

</div>

<div id="modal-root"></div>

<!-- Matter.js vía CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

<script src="app.js"></script>

</body>
</html>
